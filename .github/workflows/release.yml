name: Release

on:
  push:
    branches: [master, main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs full history for accurate changelogs / bumps
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Required for npm Trusted Publishing (OIDC)
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1
      - name: Upgrade npm for OIDC publish
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'ci: version packages'
          title: 'ci: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep empty so changesets/action does not inject a fake token
          # that blocks npm OIDC Trusted Publishing.
          NPM_TOKEN: ''
